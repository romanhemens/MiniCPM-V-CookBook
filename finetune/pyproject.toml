[project]
name = "finetune"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "accelerate==0.30.1",
    "addict==2.4.0",
    # decord has no wheels for macOS ARM64; only install on other platforms
    "aiosignal>=1.4.0",
    "decord; sys_platform != 'darwin' or platform_machine != 'arm64'",
    "deepspeed==0.12.3",
    "editdistance==0.6.2",
    "einops==0.8.0",
    "fairscale==0.4.0",
    "gradio>=4.26.0",
    "gradio-client>=0.15.1",
    "jsonlines==4.0.0",
    "librosa==0.9.0",
    "markdown2==2.4.10",
    "matplotlib==3.7.4",
    "modelscope-studio",
    "more-itertools==10.1.0",
    "moviepy>=1.0.3",
    "ninja==1.11.1.1",
    "nltk==3.8.1",
    "numpy==1.24.4",
    "opencv-python-headless==4.5.5.64",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "openpyxl==3.1.2",
    "packaging==23.2",
    "peft==0.14.0",
    "pillow==10.1.0",
    "protobuf==4.25.0",
    "sacrebleu==2.3.2",
    "seaborn==0.13.0",
    "sentencepiece==0.1.99",
    "shortuuid==1.0.11",
    "socksio==1.0.0",
    "soundfile==0.12.1",
    "spacy==3.7.2",
    "tensorboard>=2.20.0",
    "timm==0.9.10",
    "torch==2.2.0",
    "torchaudio==2.2.0",
    "torchvision==0.17.0",
    "tqdm==4.66.1",
    "transformers==4.44.2",
    "typing-extensions==4.8.0",
    "uvicorn==0.24.0.post1",
    "vector-quantize-pytorch==1.18.5",
    "vocos==0.1.0",
    "setuptools<70",
    "ipykernel>=7.2.0",
    "bitsandbytes>=0.42.0",
    "mpi4py>=4.1.1",
]

[project.optional-dependencies]
# Only install on Linux with CUDA: uv sync --extra flash-attn
flash-attn = ["flash-attn"]

[tool.uv.extra-build-dependencies]
flash-attn = ["torch"]

[tool.uv]
required-environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.uv.sources]
modelscope-studio = { url = "http://thunlp.oss-cn-qingdao.aliyuncs.com/multi_modal/never_delete/modelscope_studio-0.4.0.9-py3-none-any.whl" }
